name: PAGC token lineage integrity

on:
  pull_request:
    paths:
      - scripts/validate_pagc_token_lineage.py
      - scripts/prove_pagc_layer_safety.py
      - tests/research/test_pagc_token_lineage.py
      - research/frontier/nwagu_aneke/results/EXP-APP-003-source-classification-laundering.md
      - .github/workflows/pagc-token-lineage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed source-derived lineage
        run: python3 scripts/validate_pagc_token_lineage.py
      - name: Run adversarial classification-swap tests
        run: python3 -m unittest discover -s tests/research -p 'test_pagc_token_lineage.py' -v
      - name: Re-run EXP-APP-003 proof generator with both guards
        run: |
          python3 scripts/prove_pagc_layer_safety.py
          python3 -c "import json; r=json.load(open('experiments/EXP-APP-003-layer-safety-proof/verification_report.json')); assert r['proof_passed'] and r['proof_checks']['allowed_graph_reachability']['valid'] and r['proof_checks']['input_token_lineage']['valid']; assert r['proof_checks']['input_token_lineage']['counts']['derived_carry_through']==200"
